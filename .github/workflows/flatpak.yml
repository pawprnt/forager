name: Publish to Flathub

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  flatpak:
    uses: pawprnt/.github/.github/workflows/flatpak-publish.yml@main
    with:
      app-id: io.github.pawprnt.forager
      manifest-path: packaging/flatpak/io.github.pawprnt.forager.yml
      flathub-repo: pawprnt/flathub
    secrets: inherit
