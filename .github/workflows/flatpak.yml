name: Build Flatpak
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.8
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.pawprnt.forager.yml
          bundle: forager.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: forager-flatpak
          path: forager.flatpak

  publish-repo:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: forager-flatpak

      - uses: actions/checkout@v4
        with:
          repository: pawprnt/flatpak-repo
          token: ${{ secrets.FLATPAK_REPO_TOKEN }}
          fetch-depth: 0

      - name: Update repo
        run: |
          mkdir -p forager/repo
          mv forager.flatpak forager/repo/
          flatpak build-update-repo --generate-static-delta --prune --no-summary-index forager/repo

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "update forager" || exit 0
          git push
