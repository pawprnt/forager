app-id: io.github.pawprnt.forager
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: forager
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.keyring
  - --talk-name=org.freedesktop.secrets
  - --filesystem=home
  - --device=all
