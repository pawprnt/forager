app-id: io.github.pawprnt.forager
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: forager
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.keyring
  - --talk-name=org.freedesktop.secrets
  - --filesystem=home
  - --device=all
modules:
  - python3-dependencies
  - name: forager
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=/app --no-build-isolation .
      - install -Dm644 io.github.pawprnt.forager.desktop /app/share/applications/io.github.pawprnt.forager.desktop
      - install -Dm644 io.github.pawprnt.forager.metainfo.xml /app/share/metainfo/io.github.pawprnt.forager.metainfo.xml
      - install -Dm644 io.github.pawprnt.forager.svg /app/share/icons/hicolor/scalable/apps/io.github.pawprnt.forager.svg
    sources:
      - type: archive
        url: https://github.com/pawprnt/forager/archive/v0.5.0.tar.gz
        sha256: d0f4eb26165b50e086fb36fefd8224d2a1ed3ca4f9a388f216d74f979364cef2
      - type: file
        path: io.github.pawprnt.forager.desktop
      - type: file
        path: io.github.pawprnt.forager.metainfo.xml
      - type: file
        path: io.github.pawprnt.forager.svg

  - name: python3-dependencies
    buildsystem: simple
    build-commands: []
    modules:
      - name: python3-evdev
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "evdev>=1.6" --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/2e/07/eb30593524303d1367f0dc00c1c66582c994dba412a47751e34bad9fa29b/evdev-2.0.0.tar.gz
