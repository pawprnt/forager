    <rect x="-45" y="-10" width="8" height="24" rx="2" fill="#fff"/>
    <rect x="-53" y="-2" width="24" height="8" rx="2" fill="#fff"/>
    <!-- Buttons -->
    <circle cx="35" cy="-5" r="6" fill="#fff"/>
    <circle cx="50" cy="5" r="6" fill="#fff"/>
    <!-- Sticks -->
    <circle cx="-20" cy="15" r="8" fill="#1a1a2e"/>
    <circle cx="20" cy="15" r="8" fill="#1a1a2e"/>
